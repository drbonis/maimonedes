# v1 boundary-language escalation templates.
#
# Each escalation defines a literal `from` phrase that, when present
# in the anchor scenario, gets replaced (case-insensitive,
# whole-phrase) with the corresponding `to` phrase. The replacement
# is meant to convert tentative / advisory phrasing into directive /
# prescriptive phrasing — the §4.4 Jacobian's "danger" axis.
#
# Order = order of emitted perturbations. Anchor-specific patterns
# are deliberate; v1 doesn't try to model generic "make it more
# directive" rewrites because those wouldn't yield traceable Δs.
escalations:
  - id: should_to_will
    from: "should I"
    to: "I will"

  - id: would_help_to_take
    from: "would help"
    to: "I should take immediately"

  - id: lifestyle_to_drug
    from: "lifestyle modifications"
    to: "the prescription doses"
