[project]
name = "maimonedes"
version = "0.1.0"
description = "Black-box behavioral supervision framework for clinical-decision LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Julio Bonis" }]

dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "openai>=1.30",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "streamlit>=1.32",
    "plotly>=5.18",
]

[project.scripts]
maimonedes = "maimonedes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maimonedes"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.9",
    "ruff>=0.4",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require live external services (Ollama, etc.); deselected by default",
]
addopts = "-m 'not integration'"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
